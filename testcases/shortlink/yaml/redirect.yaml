# Shortlink 真实 SUT 的声明式 Test Specification V2。
# 本文件只属于第一个真实被测项目；通用框架不会读取或判断任何 shortlink 业务字段。
# 普通 Case 由框架 Generic Runtime 自动收集；execution=workflow 的 Case 才进入 Python Workflow。
# case id 是稳定机器主键，name 只负责报告展示；requires 只引用项目 Context Provider。
version: 2
cases:
- id: shortlink.redirect.success
  name: 新创建短链接应 302 跳转到创建时的原始链接
  level: smoke
  tags:
  - real
  - shortlink
  - redirect
  risks:
  - state_transition
  request:
    api_name: 访问动态短链接
    path_params:
      short-uri: ${short_uri}
    request_options: &id001
      allow_redirects: false
  assertions:
  - status_code: 302
  - header_eq:
    - Location
    - ${origin_url}
  operation_id: shortlinkRedirect
  requires:
  - shortlink.created
- id: shortlink.redirect.recycled
  name: 回收站中的短链接不应继续跳转原始链接
  level: core
  tags:
  - real
  - shortlink
  - redirect
  - recycle
  - negative
  risks:
  - state_transition
  request:
    api_name: 访问动态短链接
    path_params:
      short-uri: ${short_uri}
    request_options: *id001
  assertions:
  - status_code: 302
  - header_contains:
    - Location
    - /page/notfound
  operation_id: shortlinkRedirect
  requires:
  - shortlink.recycled
- id: shortlink.redirect.redis_state
  name: 真实短链访问后 Redis UV 和 UIP Set 应记录成员
  level: regression
  tags:
  - real
  - shortlink
  - redirect
  - redis
  - statistics
  risks:
  - cache_consistency
  request:
    api_name: 访问动态短链接
    path_params:
      short-uri: ${short_uri}
    request_options: *id001
  assertions:
  - status_code: 302
  - header_eq:
    - Location
    - ${origin_url}
  - redis_scard_gte:
      source: default
      key: ${uv_redis_key}
      expected: 1
  - redis_scard_gte:
      source: default
      key: ${uip_redis_key}
      expected: 1
  operation_id: shortlinkRedirect
  requires:
  - shortlink.created
- id: shortlink.redirect.notfound
  name: 不存在 shortUri 应跳转到 notfound 页面
  level: core
  tags:
  - real
  - shortlink
  - redirect
  - notfound
  - negative
  risks:
  - invalid_input
  request:
    api_name: 访问不存在的短链接
    path_params:
      short-uri: not-exists-${random_string(24)}
    request_options:
      allow_redirects: false
  assertions:
  - status_code: 302
  - header_contains:
    - Location
    - /page/notfound
  operation_id: shortlinkRedirect
