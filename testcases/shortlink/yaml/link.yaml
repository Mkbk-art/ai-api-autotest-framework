# Shortlink 真实 SUT 的声明式 Test Specification V2。
# 本文件只属于第一个真实被测项目；通用框架不会读取或判断任何 shortlink 业务字段。
# 普通 Case 由框架 Generic Runtime 自动收集；execution=workflow 的 Case 才进入 Python Workflow。
# case id 是稳定机器主键，name 只负责报告展示；requires 只引用项目 Context Provider。
version: 2
cases:
- id: shortlink.group.query.success
  name: 登录用户查询分组成功并提取首个 gid
  level: smoke
  tags:
  - real
  - shortlink
  - group
  risks:
  - authorization
  request:
    api_name: 查询当前用户短链接分组
    headers:
      username: ${username}
      token: ${token}
  assertions:
  - status_code: 200
  - eq:
    - $.code
    - '0'
  - exists: $.data[0].gid
  operation_id: shortlinkGroupList
  requires:
  - shortlink.authenticated
  extract:
    gid: $.data[0].gid
  hooks:
    after_response:
    - shortlink.capture_group
- id: shortlink.group.query.unauthorized
  name: 缺少 token 查询分组时 Gateway 应返回 401
  level: core
  tags:
  - real
  - shortlink
  - group
  - unauthorized
  - negative
  risks:
  - authorization
  request:
    api_name: 未携带 token 查询短链接分组
    headers:
      username: ${config(shortlink,username)}
  assertions:
  - status_code: 401
  - eq:
    - $.status
    - 401
  - eq:
    - $.message
    - Token validation error
  operation_id: shortlinkGroupList
- id: shortlink.link.create.success
  name: 登录用户在首个分组创建永久短链接成功
  level: smoke
  tags:
  - real
  - shortlink
  - create
  risks:
  - state_transition
  request:
    api_name: 创建永久短链接
    headers: &id001
      Content-Type: application/json
      username: ${username}
      token: ${token}
    json: &id002
      domain: ${config(shortlink,domain)}
      originUrl: https://www.doubao.com/
      gid: ${gid}
      createdType: 1
      validDateType: 0
      validDate: null
      describe: api-autotest-${timestamp_ms()}
  assertions:
  - status_code: 200
  - eq:
    - $.code
    - '0'
  - exists: $.data.fullShortUrl
  - exists: $.data.originUrl
  - exists: $.data.gid
  operation_id: shortlinkCreate
  requires:
  - shortlink.group
  extract: &id003
    short_url: $.data.fullShortUrl
    origin_url: $.data.originUrl
    created_gid: $.data.gid
  hooks:
    after_response:
    - shortlink.capture_created
    teardown:
    - shortlink.cleanup_created
- id: shortlink.link.create.invalid_url
  name: 非法 originUrl 不应生成短链接
  level: core
  tags:
  - real
  - shortlink
  - create
  - invalid_input
  - negative
  risks:
  - invalid_input
  request:
    api_name: 创建永久短链接
    headers: *id001
    json:
      domain: ${config(shortlink,domain)}
      originUrl: not-a-valid-url
      gid: ${gid}
      createdType: 1
      validDateType: 0
      validDate: null
      describe: api-autotest-invalid-origin-${timestamp_ms()}
  assertions:
  - status_code: 200
  - ne:
    - $.code
    - '0'
  - not_exists: $.data.fullShortUrl
  operation_id: shortlinkCreate
  requires:
  - shortlink.group
- id: shortlink.link.create.db_persistence
  name: 创建成功后 MySQL 物理分表应保存一致业务数据
  level: regression
  tags:
  - real
  - shortlink
  - create
  - database
  risks:
  - persistence
  request:
    api_name: 创建永久短链接
    headers: *id001
    json: *id002
  assertions:
  - status_code: 200
  - eq:
    - $.code
    - '0'
  - db_exists:
      source: default
      sql: SELECT id FROM `${link_table}` WHERE gid=%s AND CONCAT('http://', full_short_url)=%s LIMIT 1
      params:
      - ${gid}
      - ${short_url}
  - db_eq:
      source: default
      sql: SELECT origin_url FROM `${link_table}` WHERE gid=%s AND CONCAT('http://', full_short_url)=%s LIMIT 1
      params:
      - ${gid}
      - ${short_url}
      expected: ${origin_url}
  - db_eq:
      source: default
      sql: SELECT enable_status FROM `${link_table}` WHERE gid=%s AND CONCAT('http://', full_short_url)=%s LIMIT 1
      params:
      - ${gid}
      - ${short_url}
      expected: 0
  operation_id: shortlinkCreate
  requires:
  - shortlink.group
  extract: *id003
  hooks:
    after_response:
    - shortlink.capture_created
    teardown:
    - shortlink.cleanup_created
- id: shortlink.link.create.unauthorized
  name: 缺少 token 创建短链接时 Gateway 应返回 401
  level: core
  tags:
  - real
  - shortlink
  - create
  - unauthorized
  - negative
  risks:
  - authorization
  request:
    api_name: 未携带 token 创建短链接
    headers:
      Content-Type: application/json
      username: ${config(shortlink,username)}
    json:
      domain: ${config(shortlink,domain)}
      originUrl: https://www.doubao.com/
      gid: unauthorized-test-gid
      createdType: 1
      validDateType: 0
      validDate: null
      describe: api-autotest-unauthorized-${timestamp_ms()}
  assertions:
  - status_code: 401
  - eq:
    - $.status
    - 401
  - eq:
    - $.message
    - Token validation error
  operation_id: shortlinkCreate
- id: shortlink.link.page.contains_created
  name: 查询当前分组并包含刚创建的测试短链接
  level: smoke
  tags:
  - real
  - shortlink
  - page
  risks:
  - persistence
  request:
    api_name: 分页查询分组短链接
    headers:
      username: ${username}
      token: ${token}
    params:
      gid: ${gid}
      current: 1
      size: 100
      orderTag: ''
  assertions:
  - status_code: 200
  - eq:
    - $.code
    - '0'
  - exists: $.data.records
  - list_contains:
      selector: $.data.records
      where:
        fullShortUrl: ${full_short_url}
        gid: ${gid}
        originUrl: ${origin_url}
        enableStatus: 0
  operation_id: shortlinkPage
  requires:
  - shortlink.created
- id: shortlink.link.recycle.db_lifecycle
  name: 回收和逻辑删除状态应真实持久化到 MySQL
  level: regression
  tags:
  - real
  - shortlink
  - recycle
  - database
  risks:
  - state_transition
  - persistence
  request:
    api_name: 短链接回收与存储状态一致性
  assertions: []
  execution: workflow
  workflow:
    handler: shortlink.storage_lifecycle
    after_save_assertions:
    - db_eq:
        source: default
        sql: SELECT enable_status FROM `${link_table}` WHERE gid=%s AND full_short_url=%s LIMIT 1
        params:
        - ${gid}
        - ${full_short_url}
        expected: 1
    - db_eq:
        source: default
        sql: SELECT del_flag FROM `${link_table}` WHERE gid=%s AND full_short_url=%s LIMIT 1
        params:
        - ${gid}
        - ${full_short_url}
        expected: 0
    after_remove_assertions:
    - db_eq:
        source: default
        sql: SELECT del_flag FROM `${link_table}` WHERE gid=%s AND full_short_url=%s LIMIT 1
        params:
        - ${gid}
        - ${full_short_url}
        expected: 1
    - db_gte:
        source: default
        sql: SELECT del_time FROM `${link_table}` WHERE gid=%s AND full_short_url=%s LIMIT 1
        params:
        - ${gid}
        - ${full_short_url}
        expected: 1
  operations:
  - shortlinkCreate
  - shortlinkRecycleSave
  - shortlinkRecycleRemove
- id: shortlink.link.recycle.goto_cache_lifecycle
  name: Create 缓存应存在且进入回收站后 Redis 跳转缓存应删除
  level: regression
  tags:
  - real
  - shortlink
  - recycle
  - redis
  risks:
  - state_transition
  - cache_consistency
  request:
    api_name: 短链接回收与存储状态一致性
  assertions: []
  execution: workflow
  workflow:
    handler: shortlink.storage_lifecycle
    after_create_assertions:
    - redis_eq:
        source: default
        key: ${goto_redis_key}
        expected: ${origin_url}
    after_save_assertions:
    - redis_exists:
        source: default
        key: ${goto_redis_key}
        expected: false
  operations:
  - shortlinkCreate
  - shortlinkRecycleSave
  - shortlinkRecycleRemove
