# Shortlink 真实 SUT 的声明式 Test Specification V2。
# 本文件只属于第一个真实被测项目；通用框架不会读取或判断任何 shortlink 业务字段。
# 普通 Case 由框架 Generic Runtime 自动收集；execution=workflow 的 Case 才进入 Python Workflow。
# case id 是稳定机器主键，name 只负责报告展示；requires 只引用项目 Context Provider。
version: 2
cases:
- id: shortlink.auth.login.success
  name: 专用测试账号登录成功
  level: smoke
  tags:
  - real
  - shortlink
  - auth
  risks:
  - authentication
  request:
    api_name: 短链接用户登录
    headers: &id001
      Content-Type: application/json
    json:
      username: ${config(shortlink,username)}
      password: ${config(shortlink,password)}
  assertions:
  - status_code: 200
  - eq:
    - $.code
    - '0'
  - exists: $.data.token
  operation_id: shortlinkUserLogin
  requires:
  - shortlink.static
  extract:
    token: $.data.token
- id: shortlink.auth.login.invalid_password
  name: 正确用户名配合错误密码时登录应返回业务失败
  level: core
  tags:
  - real
  - shortlink
  - auth
  - negative
  risks:
  - authentication
  - invalid_input
  request:
    api_name: 短链接用户登录
    headers: *id001
    json:
      username: ${config(shortlink,username)}
      password: ${invalid_password()}
  assertions:
  - status_code: 200
  - ne:
    - $.code
    - '0'
  - not_exists: $.data.token
  operation_id: shortlinkUserLogin
  requires:
  - shortlink.static
- id: shortlink.auth.login.redis_state
  name: 登录成功后 Redis Hash 应保存当前 token 且 TTL 有效
  level: regression
  tags:
  - real
  - shortlink
  - auth
  - redis
  risks:
  - authentication
  - cache_consistency
  request:
    api_name: 短链接用户登录
    headers: *id001
    json:
      username: ${config(shortlink,username)}
      password: ${config(shortlink,password)}
  assertions:
  - status_code: 200
  - eq:
    - $.code
    - '0'
  - redis_hfield_exists:
      source: default
      key: ${login_redis_key}
      field: ${token}
  - redis_ttl_between:
      source: default
      key: ${login_redis_key}
      min: 1
      max: 1800
  operation_id: shortlinkUserLogin
  requires:
  - shortlink.static
  extract:
    token: $.data.token
