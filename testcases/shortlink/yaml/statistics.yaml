# Shortlink 真实 SUT 的声明式 Test Specification V2。
# 本文件只属于第一个真实被测项目；通用框架不会读取或判断任何 shortlink 业务字段。
# 普通 Case 由框架 Generic Runtime 自动收集；execution=workflow 的 Case 才进入 Python Workflow。
# case id 是稳定机器主键，name 只负责报告展示；requires 只引用项目 Context Provider。
version: 2
cases:
- id: shortlink.statistics.query.success
  name: 新创建短链接访问后应产生 PV UV UIP
  level: smoke
  tags:
  - real
  - shortlink
  - statistics
  risks:
  - eventual_consistency
  request:
    api_name: 查询短链接访问统计
    headers: &id001
      username: ${username}
      token: ${token}
    params: &id002
      fullShortUrl: ${full_short_url}
      gid: ${gid}
      enableStatus: 0
      startDate: ${today_str()} 00:00:00
      endDate: ${today_str()} 23:59:59
  assertions:
  - status_code: 200
  - eq:
    - $.code
    - '0'
  - gte:
    - $.data.pv
    - 1
  - gte:
    - $.data.uv
    - 1
  - gte:
    - $.data.uip
    - 1
  operation_id: shortlinkStats
  requires:
  - shortlink.visited
  poll: &id003
    timeout_seconds: 15
    interval_seconds: 1
- id: shortlink.statistics.db_persistence
  name: 异步统计最终结果应持久化到 MySQL 访问统计表
  level: regression
  tags:
  - real
  - shortlink
  - statistics
  - database
  risks:
  - eventual_consistency
  - persistence
  request:
    api_name: 查询短链接访问统计
    headers: *id001
    params: *id002
  assertions:
  - status_code: 200
  - eq:
    - $.code
    - '0'
  - gte:
    - $.data.pv
    - 1
  - gte:
    - $.data.uv
    - 1
  - gte:
    - $.data.uip
    - 1
  - db_gte:
      source: default
      sql: SELECT COALESCE(SUM(pv), 0) FROM t_link_access_stats WHERE full_short_url=%s AND date=CURDATE()
      params:
      - ${full_short_url}
      expected: 1
  - db_gte:
      source: default
      sql: SELECT COALESCE(SUM(uv), 0) FROM t_link_access_stats WHERE full_short_url=%s AND date=CURDATE()
      params:
      - ${full_short_url}
      expected: 1
  - db_gte:
      source: default
      sql: SELECT COALESCE(SUM(uip), 0) FROM t_link_access_stats WHERE full_short_url=%s AND date=CURDATE()
      params:
      - ${full_short_url}
      expected: 1
  operation_id: shortlinkStats
  requires:
  - shortlink.visited
  poll: *id003
