# 受控 Mock Demo：认证接口声明式用例。
version: 2
cases:
  - id: demo.auth.login.success
    name: 正常登录-获取Token
    operation_id: demoLogin
    level: smoke
    tags: [demo, auth]
    risks: [authentication]
    request:
      api_name: API 平台登录
      method: POST
      path: /api/v1/auth/login
      headers:
        Content-Type: application/json;charset=UTF-8
      json:
        username: demo_user
        password: demo_password
    extract:
      access_token: $.data.access_token
    assertions:
      - contains:
          status_code: 200
          msg: 登录成功

  - id: demo.auth.login.invalid_password
    name: 登录失败-密码错误
    operation_id: demoLogin
    level: smoke
    tags: [demo, auth, negative]
    risks: [authentication, invalid_input]
    request:
      api_name: API 平台登录
      method: POST
      path: /api/v1/auth/login
      headers:
        Content-Type: application/json;charset=UTF-8
      json:
        username: demo_user
        password: wrong_password
    assertions:
      - contains:
          status_code: 401
