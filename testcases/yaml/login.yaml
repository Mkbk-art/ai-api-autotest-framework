- baseInfo:
    api_name: API 平台登录
    url: /api/v1/auth/login
    method: POST
    header:
      Content-Type: application/json;charset=UTF-8
  testCase:
    - case_name: 正常登录-获取Token
      json:
        username: demo_user
        password: demo_password
      validation:
        - contains:
            status_code: 200
            msg: 登录成功
      extract:
        access_token: $.data.access_token
    - case_name: 登录失败-密码错误
      json:
        username: demo_user
        password: wrong_password
      validation:
        - contains:
            status_code: 401
