- baseInfo:
    api_name: 调用已发布接口
    url: /api/v1/interface/call
    method: POST
    header:
      Content-Type: application/json;charset=UTF-8
      Authorization: Bearer ${get_extract_data(access_token)}
  testCase:
    - case_name: 正常调用接口
      json:
        interface_id: ${get_extract_data(interface_id)}
        params:
          key: value
      validation:
        - contains:
            status_code: 200
        - eq:
            call_status: success
    - case_name: 调用-鉴权失败
      header:
        Authorization: Bearer invalid_token
      json:
        interface_id: ${get_extract_data(interface_id)}
        params: {}
      validation:
        - contains:
            status_code: 401
