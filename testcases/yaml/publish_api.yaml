- baseInfo:
    api_name: 发布新接口
    url: /api/v1/interface/publish
    method: POST
    header:
      Content-Type: application/json;charset=UTF-8
      Authorization: Bearer ${get_extract_data(access_token)}
  testCase:
    - case_name: 正常发布接口
      json:
        name: auto_test_api_${random_string(6)}
        method: GET
        path: /api/v1/demo/test
      validation:
        - contains:
            status_code: 200
        - eq:
            success: true
      extract:
        interface_id: $.data.interfaceId
    - case_name: 发布接口-未登录
      header:
        Authorization: null
      json:
        name: no_token
        method: GET
        path: /api/v1/demo/no-token
      validation:
        - contains:
            status_code: 401
