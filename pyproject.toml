[project]
name = "ai-api-autotest-framework"
version = "0.3.1"
description = "A Pytest + Requests + YAML API automation framework rebuilt from an MIT-licensed teaching baseline."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pytest>=9.0,<10",
  "requests>=2.28",
  "PyYAML>=6.0",
  "allure-pytest>=2.13",
  "PyMySQL>=1.1",
  "redis>=5.0,<9",
]

[tool.coverage.run]
source = ["core", "utils", "db", "mock_server"]

[tool.coverage.report]
show_missing = true
skip_covered = false
