# 当前文件只是“短链接真实 SUT 的本地环境配置”，不是框架固定模板。
# 换成订单、支付、用户中心等项目时，可新增 env.<project>.yaml，并在 test_selection 中选择对应 suite。
api:
  # host 是通用 ApiRunner 的默认 API 根地址；当前真实项目从本地 Gateway 暴露管理接口。
  host: http://127.0.0.1:8000
  # timeout 是单次 HTTP 请求超时；最终一致性等待由具体 Case 的 poll 单独声明。
  timeout: 10
  # 当前本地环境使用 HTTP，因此不需要 TLS 证书校验。
  verify_ssl: false
  # false 表示连接真实 SUT；受控框架自测环境可通过自己的 YAML 启用 Mock Server。
  use_mock: false

# test_selection 是框架通用的“本环境收集哪些项目 suite”配置。
# 新接入项目只需建立 testcases/<suite>/ 并把名称写在这里，不修改公共 conftest.py。
test_selection:
  # 当前本地环境只收集短链接真实项目；tests/ 下的框架单元/集成测试不受该配置影响。
  include_suites:
    - shortlink

# shortlink 是当前 SUT 自己的项目适配参数。
# 通用 ConfigManager/ApiRunner 只提供 ${config(section,key)} 读取能力，并不知道这些字段的业务含义。
shortlink:
  # 本地真实测试账号直接在 YAML 修改，不再要求每次终端 export。
  username: admin
  # 修改为本地短链接系统的测试密码；交付包保留占位符，不携带个人真实凭据。
  password: CHANGE_ME
  # domain 是当前 Create 请求使用的逻辑短域名，link.yaml 通过 ${config(shortlink,domain)} 读取。
  domain: nurl.ink:8001
  # recycle_save_path 是当前 SUT 的回收站 Save 业务接口路径。
  recycle_save_path: /api/short-link/admin/v1/recycle-bin/save
  # recycle_remove_path 是当前 SUT 的回收站 Remove 业务接口路径。
  recycle_remove_path: /api/short-link/admin/v1/recycle-bin/remove
  # create_retry 只控制“fixture 准备前置数据”的项目级 Sentinel 临时限流处理。
  create_retry:
    # 最多尝试 3 次；正式 Create 测试本身不会使用这条重试策略。
    max_attempts: 3
    # 等待略大于 1 秒，用于跨过当前本地 Sentinel QPS 窗口。
    interval_seconds: 1.1
  # storage 集中保存当前 SUT 的分片和 Redis Key 命名规则；这些规则不会进入通用 db Client。
  storage:
    # 当前 ShardingSphere HASH_MOD 使用 16 个物理分片。
    shard_count: 16
    # gid 路由后的真实短链物理表名前缀。
    link_table_prefix: t_link_
    # full_short_url 路由后的 goto 物理表名前缀。
    goto_table_prefix: t_link_goto_
    # 登录态 Hash Key 前缀；support.py 会追加当前 username。
    redis_login_key_prefix: "short-link:login:"
    # 跳转缓存 String Key 前缀；support.py 会追加 full_short_url。
    redis_goto_key_prefix: "short-link:goto:"
    # UV 去重 Set Key 前缀。
    redis_uv_key_prefix: "short-link:stats:uv:"
    # UIP 去重 Set Key 前缀。
    redis_uip_key_prefix: "short-link:stats:uip:"

# data_sources 是框架通用命名数据源配置；AssertionEngine 只认识 source，不认识当前业务表/Key。
data_sources:
  # mysql 下可以配置多个命名 MySQL 数据源，例如 default/readonly/reporting。
  mysql:
    # default 是当前短链接 Regression 使用的数据源名称。
    default:
      # MySQL 地址来自本地真实环境。
      host: 127.0.0.1
      # MySQL TCP 端口。
      port: 3306
      # 当前真实项目数据库名；换项目时只改环境 YAML。
      database: link
      # 建议使用测试环境账号；通用 Client 不关心账号业务含义。
      username: root
      # 修改为本地 MySQL 密码；纯数字 YAML 值也会由通用 Settings 规范化为字符串。
      password: CHANGE_ME
      # PyMySQL 连接字符集。
      charset: utf8mb4
      # 建立数据库连接的超时秒数。
      connect_timeout: 5
  # redis 下同样支持多个命名数据源。
  redis:
    # default 是当前 Regression 使用的默认 Redis 数据源。
    default:
      # Redis 本地地址。
      host: 127.0.0.1
      # Redis TCP 端口。
      port: 6379
      # 当前 Redis DB 编号。
      db: 0
      # 本地 Redis 无密码时保持 null；启用 requirepass 后直接修改这里。
      password: null
      # 单次 Redis 读取操作的 socket 超时秒数。
      socket_timeout: 5
      # 显式使用 RESP2，兼容本地 Redis 5.x/不支持 HELLO 的代理；Redis 6+ 需要 RESP3 时可改为 3。
      protocol: 2
