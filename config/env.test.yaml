# 受控框架验证环境：自动启动本地 Mock Server，不依赖任何真实业务系统。
api:
  # host 只是默认值；Mock fixture 启动后会使用随机本地端口覆盖实际访问地址。
  host: http://127.0.0.1:8080
  # Mock 使用 HTTP，本配置关闭证书校验仅用于受控本地环境。
  verify_ssl: false
  # true 表示由公共 fixture 启动 MockApiServer。
  use_mock: true

# collection 选择同样由环境 YAML 声明，而不是在公共 conftest.py 判断环境名称。
test_selection:
  # 当前框架自测环境只收集 Demo suite；接入新项目时无需修改 Python 判断分支。
  include_suites:
    - demo
