# 这是“真实短链接 SUT 的仓库外私有覆盖 YAML”示例，不是框架核心配置。
# 该文件可以提交到仓库，因为所有敏感值仍是占位符；实际使用时请复制到 Jenkins Agent 的仓库外目录，
# 例如 C:\ProgramData\Jenkins\.jenkins\private-configs\shortlink-local.override.yaml，
# 然后只在那份仓库外副本中填写真实值，绝不要把真实密码回写到本示例或公共 env.shortlink-local.yaml。

# shortlink 这一 section 属于当前真实 SUT 的 Project Adapter；ConfigManager 只做通用递归合并，
# 并不知道 username/password 的业务含义。换成订单、支付等项目时，可以有完全不同的 section 名称。
shortlink:
  # 登录账号如果与公共 env.shortlink-local.yaml 一致，可以删除这一行；这里只演示“私有层可覆盖任意字段”。
  username: admin
  # 实际副本中填写真实测试账号密码；示例永远保留占位符。
  password: CHANGE_ME_LOCAL

# data_sources 是框架通用命名数据源结构；这里只覆盖当前本机 MySQL 的私有账号信息。
data_sources:
  mysql:
    default:
      # 如果数据库用户名不是敏感信息，也可以继续放在公共环境 YAML 中而不在私有文件重复。
      username: root
      # 实际副本中填写本机测试数据库密码；不需要重复 host/port/database/charset 等公共字段。
      password: CHANGE_ME_LOCAL
