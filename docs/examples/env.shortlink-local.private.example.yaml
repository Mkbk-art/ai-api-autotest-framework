# 私有 Shortlink 本机覆盖示例。
# 使用时请复制为 config/env.shortlink-local.private.yaml；该命名已被 .gitignore 保护。
# 不要把真实账号、数据库密码、Redis 密码或其他 Secret 提交到 GitHub。

shortlink:
  username: CHANGE_ME
  password: CHANGE_ME

data_sources:
  mysql:
    default:
      username: CHANGE_ME
      password: CHANGE_ME
  redis:
    default:
      password: null
